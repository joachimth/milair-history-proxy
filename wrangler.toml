name = "milair-history-proxy"
main = "src/index.js"
compatibility_date = "2026-07-01"

# ---------------------------------------------------------------------------
# Cron trigger: poll adsb.lol every 2 minutes to accumulate our own history.
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/2 * * * *"]

# ---------------------------------------------------------------------------
# D1 database binding. Create it once with:
#   wrangler d1 create milair-history
# then paste the printed database_id below (replace REPLACE_WITH_DATABASE_ID).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "milair-history"
database_id = "76702425-ec90-4495-b2aa-211c81da43e4"

# ---------------------------------------------------------------------------
# Config. Safe defaults; override in the Cloudflare dashboard or here.
# ---------------------------------------------------------------------------
[vars]
# Lock CORS to your app origin in production, e.g. "https://joachimth.github.io".
ALLOWED_ORIGIN = "*"
# Region to collect, as "west,south,east,north". Default = Northern Europe.
REGION_BBOX = "-10.0,50.0,40.0,70.0"
# How many days of history to keep.
RETENTION_DAYS = "30"
# Movement dedup: only store a new point if the aircraft moved >= this many
# metres, OR at least DEDUP_MIN_SECONDS have passed since its last stored point.
DEDUP_MIN_METERS = "200"
DEDUP_MIN_SECONDS = "60"
